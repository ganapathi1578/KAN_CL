[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kan-continual"
version = "0.1.0"
description = "Modular Kolmogorov-Arnold Networks and continual domain-learning research framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "KAN Continual Research Framework"}]
dependencies = ["torch>=2.0", "numpy>=1.23", "Pillow>=9.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
kan-cl = "kan_cl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kan_cl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
